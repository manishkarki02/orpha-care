name: Orpha-Care CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"

  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Backend Validation

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orpha_care_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d orpha_care_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orpha_care_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/orpha_care_test

      REDIS_URL: redis://localhost:6379

      ACCESS_TOKEN_SECRET: ci_access_token_secret_12345678901234567890
      REFRESH_TOKEN_SECRET: ci_refresh_token_secret_12345678901234567890

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate prisma client
        run: pnpm prisma:generate

      - name: Apply migration
        run: pnpm prisma migrate deploy

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run build
        run: pnpm build

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: orpha-care-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
