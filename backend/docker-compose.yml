name: orpha-care-dev

services:
  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orphacare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orphacare}
      POSTGRES_DB: ${POSTGRES_DB:-orphacare_dev}

    ports:
      - "5432:5432"
    
    volumes:
      - orphacare_dev_data:/var/lib/postgres/database

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orphacare} -d ${POSTGRES_DB:-orphacare_dev}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine

    restart: unless-stopped

    command: 
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    volumes:
      - redis_dev_data:/data

    networks:
      - backend

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    
    environment:
      NODE_ENV: dev
      PORT: 3000
    
    env_file:
      - .env
    
    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    networks:
      - backend
    
    depends_on:
      postgres:
        condition: service_healthy

    command: pnpm dev

    stdin_open: true
    tty: true

networks:
  backend:
  
volumes:
  node_modules:
  orphacare_dev_data:
  redis_dev_data:


